[tool.ruff]
target-version = "py312"
line-length = 100
# Keep imported legacy formatting; compilation and behavior tests still cover it.
extend-exclude = ["qbitbot/app.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
markers = [
    "known_bug: regression tests for defects captured in the deployment baseline",
]
