[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "qbitbot"
version = "0.3.0"
description = "Telegram search and download controls for qBittorrent and Jackett"
readme = "README.md"
requires-python = "~=3.12.0"
license = "MIT"
license-files = ["LICENSE", "docs/licenses/THIRD_PARTY_NOTICES.md"]
dependencies = [
    "python-telegram-bot==21.11.1",
    "requests==2.33.0",
    "urllib3==2.8.0",
    "idna==3.15",
]

[project.urls]
Repository = "https://github.com/Nerfagol/qbitbot"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["qbitbot", "qbitbot.cli", "qbitbot.clients"]
namespaces = false

[tool.setuptools.package-data]
qbitbot = ["locales/en.json", "locales/ru.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Keep imported legacy formatting; compilation and behavior tests still cover it.
extend-exclude = ["src/qbitbot/app.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
markers = [
    "known_bug: regression tests for defects captured in the deployment baseline",
]
