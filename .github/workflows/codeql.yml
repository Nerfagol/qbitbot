name: codeql
on:
  push:
    # Dependabot push tokens cannot upload SARIF; its PR runs can.
    branches-ignore:
      - 'dependabot/**'
  pull_request:
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    name: CodeQL (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.15'
      - name: Initialize Python analysis
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - name: Analyze Python source
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:python
