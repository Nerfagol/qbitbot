name: codeql
on:
  push:
    # Dependabot push tokens cannot upload SARIF; its PR runs can.
    branches-ignore:
      - 'dependabot/**'
  pull_request:
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    name: CodeQL (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.15'
      - name: Initialize Python analysis
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - name: Analyze Python source
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:python
