name: security
on:
  push:
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        id: gitleaks
        run: |
          mkdir "$RUNNER_TEMP/gitleaks"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks/archive.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$RUNNER_TEMP/gitleaks/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks/archive.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan complete public history
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts='--all --full-history' --redact
      - name: Scan tracked source export
        if: ${{ !cancelled() && steps.gitleaks.outcome == 'success' }}
        run: |
          mkdir "$RUNNER_TEMP/reviewed-source"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/reviewed-source"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir "$RUNNER_TEMP/reviewed-source" \
            --config .gitleaks.toml --redact
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          license-check: false
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.15'
      - name: Audit the complete Python dependency lock
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/audit/bin/pip-audit" -r requirements/dev.lock --no-deps --disable-pip
      - name: Install checksum-pinned Trivy
        run: |
          mkdir "$RUNNER_TEMP/trivy"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz \
            --output "$RUNNER_TEMP/trivy/archive.tar.gz"
          printf '%s  %s\n' c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0 \
            "$RUNNER_TEMP/trivy/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy/archive.tar.gz" -C "$RUNNER_TEMP/trivy" trivy
      - name: Build and scan every runtime image
        run: |
          docker build -f deploy/docker/bot.Dockerfile -t qbitbot-security-ci:bot .
          docker build -f deploy/docker/qbittorrent.Dockerfile -t qbitbot-security-ci:qbittorrent .
          docker build -f deploy/docker/jackett.Dockerfile -t qbitbot-security-ci:jackett .
          docker build -f deploy/docker/flaresolverr.Dockerfile -t qbitbot-security-ci:flaresolverr .
          scan_status=0
          python integration/flaresolverr.py --image qbitbot-security-ci:flaresolverr || scan_status=1
          for component in bot qbittorrent jackett flaresolverr; do
            printf 'Scanning %s\n' "$component"
            docker image save "qbitbot-security-ci:$component" -o "$RUNNER_TEMP/$component.tar"
            "$RUNNER_TEMP/trivy/trivy" image --input "$RUNNER_TEMP/$component.tar" \
              --scanners vuln --exit-code 1 --no-progress || scan_status=1
          done
          exit "$scan_status"
